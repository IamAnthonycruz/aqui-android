<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- DwellPing app icon. Source for app/src/main/res/drawable/ic_launcher_*.xml (same 108x108 coordinates). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2A4A"/>
      <stop offset="1" stop-color="#3B2F5C"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <!-- The geofence circle the pin sits in, seen at an angle -->
  <path d="M28,74 a26,8 0 1,0 52,0 a26,8 0 1,0 -52,0 Z" fill="none" stroke="#3DDC97" stroke-opacity="0.45" stroke-width="2.5"/>
  <path d="M38,74 a16,5 0 1,0 32,0 a16,5 0 1,0 -32,0 Z" fill="none" stroke="#3DDC97" stroke-opacity="0.8" stroke-width="2.5"/>
  <!-- The pin, with a hole -->
  <path fill-rule="evenodd" fill="#F2F0FA"
        d="M54,75 C49,68 39,57 39,46 A15,15 0 0,1 69,46 C69,57 59,68 54,75 Z M48,46 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0 Z"/>
</svg>
